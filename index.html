<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AttackHub Admin Panel - Pro (2-Tier Login)</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        body { background-color: #09090b; color: #ffffff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; padding-top: 30px; margin: 0; }
        .container { background-color: #18181b; padding: 25px; border-radius: 16px; width: 480px; border: 1px solid #27272a; box-sizing: border-box; }
        h2 { margin-bottom: 15px; color: #3b82f6; text-align: center; }
        label { display: block; font-size: 12px; margin-bottom: 5px; color: #a1a1aa; }
        input, select, button { width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #3f3f46; background: #27272a; color: white; box-sizing: border-box; }
        button { background-color: #3b82f6; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background-color: #2563eb; }
        table { width: 100%; margin-top: 15px; border-collapse: collapse; font-size: 11px; }
        th, td { border: 1px solid #27272a; padding: 8px; text-align: left; word-break: break-all; }
        th { background: #27272a; color: #3b82f6; }
        .btn-danger { background-color: #ef4444; width: auto; padding: 4px 8px; font-size: 10px; margin: 0; }
        .btn-warning { background-color: #f59e0b; width: auto; padding: 4px 8px; font-size: 10px; margin: 2px 0; }
        .error-msg { color: #ef4444; font-size: 11px; text-align: center; margin-bottom: 10px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <!-- หน้าล็อคอิน 2 ชั้น -->
    <div id="loginPanel">
        <h2>Admin Login (2-Tier)</h2>
        <label>รหัสผ่านชั้นที่ 1:</label>
        <input type="password" id="tier1Password" placeholder="ใส่รหัสผ่านชั้นที่ 1...">
        
        <label>รหัสผ่านชั้นที่ 2:</label>
        <input type="password" id="tier2Password" placeholder="ใส่รหัสผ่านชั้นที่ 2...">
        
        <div id="loginError" class="error-msg">รหัสผ่านไม่ถูกต้อง กรุณาลองใหม่อีกครั้ง!</div>
        <button onclick="login()">เข้าสู่ระบบ</button>
    </div>

    <!-- หน้าจัดการคีย์ -->
    <div id="adminPanel" style="display:none;">
        <h2>AttackHub Key Management</h2>
        
        <label>เลือกอายุของคีย์:</label>
        <select id="keyDuration">
            <option value="1">1 วัน</option>
            <option value="5">5 วัน</option>
            <option value="7" selected>7 วัน</option>
            <option value="30">30 วัน</option>
            <option value="0">ถาวร (ไม่มีวันหมดอายุ)</option>
        </select>
        <button onclick="createKey()">สร้างคีย์ใหม่</button>

        <h3 style="font-size: 14px; margin-top: 20px;">รายการคีย์ทั้งหมดในระบบ</h3>
        <div style="max-height: 350px; overflow-y: auto;">
            <table>
                <thead>
                    <tr>
                        <th>คีย์ / สถานะ</th>
                        <th>รายละเอียด / HWID</th>
                        <th>จัดการ</th>
                    </tr>
                </thead>
                <tbody id="keyList">
                    <!-- โหลดข้อมูลจาก Firebase -->
                </tbody>
            </table>
        </div>
        <button onclick="logout()" style="background-color: #3f3f46; margin-top: 15px;">ออกจากระบบ</button>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyB6y2HzVlbIIy1b5DjCllTwfftyLYZYWew",
        authDomain: "attackhubkey.firebaseapp.com",
        databaseURL: "https://attackhubkey-default-rtdb.firebaseio.com",
        projectId: "attackhubkey",
        storageBucket: "attackhubkey.firebasestorage.app",
        messagingSenderId: "524557895372",
        appId: "1:524557895372:web:edf9b64cac64f4f27be469"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const TIER1_PASS = "9_atikun";
    const TIER2_PASS = "0637318831Nn";

    // ตรวจสอบสถานะการล็อกอินค้างไว้ในเบราว์เซอร์
    window.onload = function() {
        if (localStorage.getItem("attack_auth") === "true") {
            document.getElementById("loginPanel").style.display = "none";
            document.getElementById("adminPanel").style.display = "block";
            loadKeys();
        }
    }

    function login() {
        const t1 = document.getElementById("tier1Password").value;
        const t2 = document.getElementById("tier2Password").value;
        const errorEl = document.getElementById("loginError");

        if (t1 === TIER1_PASS && t2 === TIER2_PASS) {
            localStorage.setItem("attack_auth", "true");
            document.getElementById("loginPanel").style.display = "none";
            document.getElementById("adminPanel").style.display = "block";
            loadKeys();
        } else {
            errorEl.style.display = "block";
        }
    }

    function logout() {
        localStorage.removeItem("attack_auth");
        location.reload();
    }

    function createKey() {
        const days = parseInt(document.getElementById("keyDuration").value);
        
        const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
        const randomPart = (length) => {
            let result = "";
            for (let i = 0; i < length; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        };

        const newKey = "attack-" + randomPart(7) + "-" + randomPart(6) + "-" + randomPart(5) + "-" + randomPart(5);
        
        let expireTime = 0;
        if (days > 0) {
            expireTime = Date.now() + (days * 86400000);
        }

        db.ref('keys/' + newKey).set({
            key: newKey,
            expireTime: expireTime,
            hwid: "",
            usedAt: ""
        }).then(() => {
            alert("สร้างคีย์สำเร็จ: " + newKey);
        });
    }

    function loadKeys() {
        db.ref('keys').on('value', (snapshot) => {
            const list = document.getElementById("keyList");
            list.innerHTML = "";
            const data = snapshot.val();
            
            if (!data) {
                list.innerHTML = "<tr><td colspan='3' style='text-align:center;'>ยังไม่มีคีย์ในระบบ</td></tr>";
                return;
            }

            for (let id in data) {
                let item = data[id];
                let now = Date.now();
                let statusColor = "#10b981";
                let statusText = "ใช้งานได้ปกติ";

                if (item.expireTime > 0 && now > item.expireTime) {
                    statusColor = "#ef4444";
                    statusText = "หมดอายุแล้ว";
                } else if (item.hwid && item.hwid !== "") {
                    statusText = "ถูกใช้งานแล้ว";
                }

                let row = `<tr>
                    <td>
                        <strong style="color:#60a5fa; font-size: 10px;">${item.key}</strong><br>
                        <span style="color:${statusColor};">${statusText}</span>
                    </td>
                    <td>
                        <small>ใช้เมื่อ: ${item.usedAt ? new Date(item.usedAt).toLocaleString() : 'ยังไม่เคยใช้'}</small><br>
                        <small>HWID: ${item.hwid ? item.hwid : 'ไม่มี (ยังไม่ผูกเครื่อง)'}</small>
                    </td>
                    <td>
                        <button class="btn-warning" onclick="resetHwid('${id}')">รีเซ็ตไอดี</button><br>
                        <button class="btn-danger" onclick="deleteKey('${id}')">ลบ</button>
                    </td>
                </tr>`;
                list.innerHTML += row;
            }
        });
    }

    function deleteKey(keyId) {
        if (confirm("ต้องการลบคีย์นี้ใช่หรือไม่?")) {
            db.ref('keys/' + keyId).remove();
        }
    }

    function resetHwid(keyId) {
        if (confirm("ต้องการรีเซ็ตไอดีเครื่อง (HWID) ของคีย์นี้ใช่หรือไม่?")) {
            db.ref('keys/' + keyId).update({
                hwid: "",
                usedAt: ""
            });
            alert("รีเซ็ตไอดีเครื่องสำเร็จ!");
        }
    }
</script>

</body>
</html>
